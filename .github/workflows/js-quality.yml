name: JavaScript quality

on:
  workflow_call:
    inputs:
      node26_compatibility:
        description: Run a separate Node 26 compatibility job
        required: false
        type: boolean
        default: false
      pre_ci_command:
        description: Optional repository-owned setup command required before pnpm ci
        required: false
        type: string
        default: ''

permissions:
  contents: read

jobs:
  dependency-review:
    name: Dependency review
    if: ${{ github.event_name == 'pull_request' }}
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/dependency-review-action@2031cfc080254a8a887f58cffee85186f0e49e48 # v4.9.0

  canonical:
    name: Node 24 canonical
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
      - name: Verify package-manager baseline
        run: |
          node <<'NODE'
          const pkg = require('./package.json');
          if (pkg.packageManager !== 'pnpm@11.20.0') {
            console.error(`packageManager must be exactly pnpm@11.20.0; found ${pkg.packageManager ?? '<missing>'}`);
            process.exit(1);
          }
          NODE
      - uses: pnpm/action-setup@fc06bc1257f339d1d5d8b3a19a8cae5388b55320 # v4.4.0
        with:
          run_install: false
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version: 24
          cache: pnpm
      - name: Verify pnpm version
        run: test "$(pnpm --version)" = "11.20.0"
      - run: pnpm install --frozen-lockfile
      - name: Run repository pre-CI setup
        if: ${{ inputs.pre_ci_command != '' }}
        run: ${{ inputs.pre_ci_command }}
      - run: pnpm ci

  node26-compatibility:
    name: Node 26 compatibility
    if: ${{ inputs.node26_compatibility }}
    continue-on-error: true
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
      - name: Verify package-manager baseline
        run: |
          node <<'NODE'
          const pkg = require('./package.json');
          if (pkg.packageManager !== 'pnpm@11.20.0') {
            console.error(`packageManager must be exactly pnpm@11.20.0; found ${pkg.packageManager ?? '<missing>'}`);
            process.exit(1);
          }
          NODE
      - uses: pnpm/action-setup@fc06bc1257f339d1d5d8b3a19a8cae5388b55320 # v4.4.0
        with:
          run_install: false
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version: 26
          cache: pnpm
      - name: Verify pnpm version
        run: test "$(pnpm --version)" = "11.20.0"
      - run: pnpm install --frozen-lockfile
      - name: Run repository pre-CI setup
        if: ${{ inputs.pre_ci_command != '' }}
        run: ${{ inputs.pre_ci_command }}
      - run: pnpm ci
