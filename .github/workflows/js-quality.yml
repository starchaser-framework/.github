name: JavaScript quality

on:
  workflow_call:
    inputs:
      node26_compatibility:
        description: Run a separate Node 26 compatibility job
        required: false
        type: boolean
        default: false
      pre_ci_command:
        description: Optional repository-owned setup command required before pnpm ci
        required: false
        type: string
        default: ''

permissions:
  contents: read

jobs:
  canonical:
    name: Node 24 canonical
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
        with:
          run_install: false
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - name: Run repository pre-CI setup
        if: ${{ inputs.pre_ci_command != '' }}
        run: ${{ inputs.pre_ci_command }}
      - run: pnpm ci

  node26-compatibility:
    name: Node 26 compatibility
    if: ${{ inputs.node26_compatibility }}
    continue-on-error: true
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
        with:
          run_install: false
      - uses: actions/setup-node@v4
        with:
          node-version: 26
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - name: Run repository pre-CI setup
        if: ${{ inputs.pre_ci_command != '' }}
        run: ${{ inputs.pre_ci_command }}
      - run: pnpm ci
